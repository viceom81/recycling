<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>분리배출 교실</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
       background:#fbfbfa;color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column;
       user-select:none;-webkit-user-select:none}
  #app{flex:1;display:flex;flex-direction:column;width:100%;max-width:1500px;margin:0 auto;
       padding:clamp(14px,2vw,28px)}
  button{font-family:inherit;cursor:pointer;touch-action:manipulation;border:none;background:none}

  .bar{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:16px}
  .progress{font-size:clamp(18px,1.8vw,24px);font-weight:700;color:#8a8a85;letter-spacing:1px}
  .wrongcount{font-size:clamp(16px,1.5vw,21px);font-weight:700;color:#c94a3f}
  .btn-home{font-size:clamp(17px,1.6vw,22px);font-weight:800;color:#3a3a36;
            min-height:56px;padding:12px 26px;
            border:3px solid #b8b8b0;border-radius:14px;background:#fff}
  .btn-home:active{transform:scale(.97)}
  .btn-sub{min-width:230px;min-height:88px;font-size:clamp(23px,2.4vw,31px);font-weight:800;
           color:#3a3a36;background:#fff;border:4px solid #b8b8b0;border-radius:20px;padding:12px 32px}
  .btn-sub:active{transform:scale(.98)}

  .head{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap;
        min-height:96px;margin-bottom:8px}
  .title{font-size:clamp(30px,3.6vw,48px);font-weight:800;letter-spacing:-1px;text-align:center}
  .spk{min-width:130px;min-height:64px;font-size:clamp(18px,1.7vw,23px);font-weight:700;
       color:#1a1a1a;background:#fff;border:3px solid #b8b8b0;border-radius:16px;padding:8px 20px}
  .spk:active{transform:scale(.97)}

  .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:clamp(18px,2.6vh,32px);width:100%}
  .foot{min-height:104px;display:flex;align-items:center;justify-content:center;gap:24px}
  .next{min-width:250px;min-height:88px;font-size:clamp(25px,2.6vw,34px);font-weight:800;
        color:#fff;background:#3a3a36;border-radius:20px;padding:12px 36px}
  .next:active{transform:scale(.98)}

  .choice{min-width:120px;min-height:120px;background:#fff;border:5px solid #e4e4de;
          border-radius:22px;cursor:pointer;touch-action:manipulation;overflow:hidden;
          display:flex;align-items:center;justify-content:center;
          transition:transform .12s ease,border-color .12s ease}
  .choice.sel{border-color:#3a3a36;border-width:7px;transform:scale(1.03)}
  .choice.ok{border-color:#1c8c4a;border-width:7px}
  .choice.no{border-color:#c94a3f;border-width:7px;animation:shake .5s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-11px)}
    40%{transform:translateX(11px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}

  .imgbox{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#fff}
  .imgbox img{width:100%;height:100%;object-fit:contain;display:block}
  .imgfail{font-size:15px;font-weight:700;color:#8a8a85;text-align:center;padding:12px;
           line-height:1.5;word-break:break-all}

  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;width:100%;max-width:980px}
  .grid3 .choice{height:clamp(180px,29vh,330px)}
  .bins{display:grid;grid-template-columns:repeat(4,1fr);gap:26px;width:100%;max-width:1150px}
  .bins .choice{height:clamp(155px,25vh,265px);padding:10px}
  .words{display:grid;grid-template-columns:repeat(2,1fr);gap:26px;width:100%;max-width:760px}
  .words .choice{min-height:126px;font-size:clamp(26px,3.1vw,38px);font-weight:800}
  .single{width:100%;max-width:440px;height:clamp(195px,30vh,330px);background:#fff;
          border:4px solid #e4e4de;border-radius:22px;overflow:hidden;
          display:flex;align-items:center;justify-content:center}
  .single img{width:100%;height:100%;object-fit:contain}

  .start{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:34px;
         width:100%;max-width:720px}
  .btn-stage{min-height:210px;font-size:clamp(34px,4vw,50px);font-weight:800;color:#1a1a1a;
             background:#fff;border:5px solid #dcdcd6;border-radius:26px}
  .btn-stage:active{transform:scale(.98)}

  .guide{width:100%;max-width:840px;height:clamp(270px,48vh,520px);border:4px solid #e4e4de;
         border-radius:22px;overflow:hidden;background:#fff;
         display:flex;align-items:center;justify-content:center}
  .guide img{width:100%;height:100%;object-fit:contain}
  .guide-fallback{font-size:clamp(24px,2.6vw,34px);font-weight:700;color:#6b6b66;text-align:center;
                  padding:30px;line-height:1.6}

  .end{display:flex;flex-direction:column;align-items:center;gap:34px;width:100%}
  .end-count{font-size:clamp(30px,3.7vw,46px);font-weight:800;text-align:center}
  .end-sub{font-size:clamp(21px,2.3vw,29px);font-weight:700;color:#6b6b66}
  .hard{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;width:100%}
  .hard-card{width:165px;min-height:190px;background:#fff;border:4px solid #e4e4de;
             border-radius:20px;display:flex;flex-direction:column;align-items:center;
             padding:12px;gap:10px}
  .hard-card .imgbox{width:125px;height:125px}
  .hard-name{font-size:20px;font-weight:700}

  .banner{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:18px 46px;
          border-radius:44px;font-size:clamp(23px,2.4vw,32px);font-weight:800;color:#fff;
          box-shadow:0 8px 22px rgba(0,0,0,.16);z-index:999;display:none}
  .banner.ok{background:#1c8c4a;display:block}
  .banner.no{background:#c94a3f;display:block}
  .banner.info{background:#5a5a54;display:block}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="banner" class="banner"></div>
<main id="app"></main>

const BINS = [
  { key:"mint",   label:"캔",       img:"bin_mint"   },
  { key:"yellow", label:"플라스틱", img:"bin_yellow" },
  { key:"pink",   label:"종이",     img:"bin_pink"   },

const LATE      = ["우유갑","물티슈","휴지"];          /* 헷갈리는 항목은 뒤로 */
const OK_DELAY  = 1400;
const NO_DELAY  = 1200;

/* ═══════════ 상태 ═══════════ */
let stage=1, phase='A';
let qList=[], qIdx=0, choices=[], selected=null, locked=false;
const wrongIds=new Set();
let resumeFn=null;
const app=document.getElementById('app');
const bannerEl=document.getElementById('banner');
let bannerTimer=null;

/* ═══════════ 소리 ═══════════ */
function speak(t){
  if(!t||!window.speechSynthesis) return;
  try{
    window.speechSynthesis.cancel();
    setTimeout(()=>{
      const u=new SpeechSynthesisUtterance(t);
      u.lang='ko-KR'; u.rate=0.9;
      window.speechSynthesis.speak(u);
    },70);
  }catch(e){}
}
function warmUpVoice(){
  if(!window.speechSynthesis) return;
  try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;u.lang='ko-KR';
      window.speechSynthesis.speak(u);}catch(e){}
}

/* ═══════════ 도우미 ═══════════ */
function josa(w){
  if(!w) return '을';
  const c=w.charCodeAt(w.length-1)-0xAC00;
  if(c<0||c>11171) return '을';
  return (c%28>0)?'을':'를';
}
function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function src(key){ return IMG[key]||''; }
function imgHTML(key,alt){
  const d=src(key);
  if(!d) return '<div class="imgfail">사진 없음<br>'+key+'</div>';
  return '<div class="imgbox"><img src="'+d+'" alt="'+(alt||'')+'"></div>';
}
function showBanner(t,c){bannerEl.textContent=t;bannerEl.className='banner '+c;
  if(bannerTimer)clearTimeout(bannerTimer);}
function hideBanner(){bannerEl.className='banner';}
function flashBanner(t,c,ms){showBanner(t,c);bannerTimer=setTimeout(hideBanner,ms||1500);}

/* ═══════════ 공통 렌더 ═══════════ */
function frame(inner,o){
  o=o||{};
  const wc=(o.progress && wrongIds.size>0)
    ? '<div class="wrongcount">틀린 쓰레기 '+wrongIds.size+'개</div>' : '';
  app.innerHTML='<div class="bar"><div class="progress">'+(o.progress||'')+'</div>'+wc+
    (o.home!==false?'<button class="btn-home" id="homeBtn">기록 보기</button>':'')+'</div>'+inner;
  const h=document.getElementById('homeBtn');
  if(h) h.addEventListener('click',()=>{ if(!locked) renderRecord(); });
}
function bindCommon(){
  document.querySelectorAll('.spk').forEach(b=>b.addEventListener('click',()=>speak(b.dataset.say)));
  document.querySelectorAll('.choice').forEach(c=>{
    c.addEventListener('click',()=>onChoice(c));
    if(selected!==null && c.dataset.val===selected) c.classList.add('sel');
  });
  const n=document.querySelector('.next');
  if(n) n.addEventListener('click',submit);
}
function onChoice(el){
  if(locked) return;
  hideBanner();
  speak(el.dataset.say);
  const v=el.dataset.val;
  if(selected===v){selected=null;el.classList.remove('sel');}
  else{
    document.querySelectorAll('.choice.sel').forEach(x=>x.classList.remove('sel'));
    selected=v; el.classList.add('sel');
  }
}

/* ═══════════ 시작 ═══════════ */
function renderStart(){
  selected=null; locked=false;
  frame('<div class="mid"><div class="start">'+
        '<button class="btn-stage" data-stage="1">1단계</button>'+
        '<button class="btn-stage" data-stage="2">2단계</button></div></div>',{home:false});
  document.querySelectorAll('.btn-stage').forEach(b=>{
    b.addEventListener('click',()=>{warmUpVoice();startStage(Number(b.dataset.stage));});
  });
}

function startStage(n){
  stage=n;
  /* 전체 문항 출제. 헷갈리는 항목만 뒤로 보냅니다. */
  const normal =ITEMS.filter(x=>!LATE.includes(x.name));
  const special=ITEMS.filter(x=> LATE.includes(x.name));
  qList=[...shuffle(normal),...shuffle(special)];
  qIdx=0; wrongIds.clear();
  setupA();
}

/* ═══════════ 화면 A ═══════════ */
function setupA(){
  phase='A'; selected=null; locked=false;
  const it=qList[qIdx];
  const others=shuffle(ITEMS.filter(x=>x.id!==it.id));
  if(stage===1){
    choices=shuffle([it,...others.slice(0,2)]);
    renderA1();
  }else{
    choices=shuffle([it.name,...others.slice(0,3).map(x=>x.name)]);
    renderA2();
  }
}
function progressText(){return (qIdx+1)+' / '+qList.length;}

function renderA1(){
  resumeFn=renderA1;
  const it=qList[qIdx];
  const q=it.name+josa(it.name)+' 찾아보아요';
  frame('<div class="head"><span class="title">'+q+'</span>'+
        '<button class="spk" data-say="'+q+'">소리 듣기</button></div>'+
        '<div class="mid"><div class="grid3">'+
        choices.map(c=>'<div class="choice" data-val="'+c.id+'" data-say="'+c.name+'">'+
                       imgHTML(c.id,c.name)+'</div>').join('')+
        '</div></div><div class="foot"><button class="next">다음 문제</button></div>',
        {progress:progressText()});
  bindCommon();
}

function renderA2(){
  resumeFn=renderA2;
  const it=qList[qIdx];
  frame('<div class="head"><span class="title">이건 뭐예요?</span></div>'+
        '<div class="mid"><div class="single">'+
        (src(it.id)?'<img src="'+src(it.id)+'" alt="쓰레기">':'<div class="imgfail">사진 없음<br>'+it.id+'</div>')+
        '</div><div class="words">'+
        choices.map(w=>'<div class="choice" data-val="'+w+'" data-say="'+w+'">'+w+'</div>').join('')+
        '</div></div><div class="foot"><button class="next">다음 문제</button></div>',
        {progress:progressText()});
  bindCommon();
}

/* ═══════════ 화면 B ═══════════ */
function renderB(){
  resumeFn=renderB;
  phase='B';
  const it=qList[qIdx];
  frame('<div class="head"><span class="title">어디에 버려요?</span>'+
        (stage===1?'<button class="spk" data-say="어디에 버려요?">소리 듣기</button>':'')+'</div>'+
        '<div class="mid"><div class="single">'+
        (src(it.id)?'<img src="'+src(it.id)+'" alt="쓰레기">':'<div class="imgfail">사진 없음<br>'+it.id+'</div>')+
        '</div><div class="bins">'+
        BINS.map(b=>'<div class="choice" data-val="'+b.key+'" data-say="'+b.label+'">'+
                    imgHTML(b.img,b.label)+'</div>').join('')+
        '</div></div><div class="foot"><button class="next">다음 문제</button></div>',
        {progress:progressText()});
  bindCommon();
}

/* ═══════════ 판정 ═══════════ */
function submit(){
  if(locked) return;
  if(selected===null){
    flashBanner('하나를 골라 주세요','info',1500);
    speak('하나를 골라 주세요');
    return;
  }
  const it=qList[qIdx];
  let correct;
  if(phase==='A') correct=(stage===1)?(selected===it.id):(selected===it.name);
  else            correct=(selected===it.bin);

  const el=document.querySelector('.choice.sel');
  locked=true;

  if(correct){
    if(el){el.classList.remove('sel');el.classList.add('ok');}
    showBanner('맞았어요','ok');
    speak('맞았어요');
    setTimeout(()=>{
      hideBanner(); locked=false;
      if(phase==='A'){selected=null;renderB();}
      else advance();
    },OK_DELAY);
  }else{
    wrongIds.add(it.id);
    if(el){el.classList.remove('sel');el.classList.add('no');}
    showBanner('다시 한 번 볼까요?','no');
    speak('다시 한 번 볼까요');
    setTimeout(()=>{
      hideBanner();
      if(phase==='B'){locked=false;selected=null;renderGuide();}
      else{if(el)el.classList.remove('no');selected=null;locked=false;}
    },NO_DELAY);
  }
}
function advance(){
  qIdx++;
  if(qIdx>=qList.length) renderEnd();
  else setupA();
}

/* ═══════════ 안내판 화면 ═══════════ */
function renderGuide(){
  resumeFn=renderGuide;
  const q='우리가 만든 안내판을 보고 답하세요';
  const d=src('guide');
  frame('<div class="head"><span class="title">'+q+'</span>'+
        '<button class="spk" data-say="'+q+'">소리 듣기</button></div>'+
        '<div class="mid"><div class="guide">'+
        (d?'<img src="'+d+'" alt="안내판">':'<div class="guide-fallback">교실에 붙어 있는<br>우리 안내판을 보세요</div>')+
        '</div></div><div class="foot"><button class="next">다시 해보기</button></div>',
        {progress:progressText()});
  document.querySelectorAll('.spk').forEach(b=>b.addEventListener('click',()=>speak(b.dataset.say)));
  document.querySelector('.next').addEventListener('click',()=>{selected=null;locked=false;renderB();});
}


/* ═══════════ 기록 화면 (교사용) ═══════════ */
function renderRecord(){
  const done=qIdx;                     /* 끝까지 맞힌 문항 수 */
  const hard=ITEMS.filter(x=>wrongIds.has(x.id));
  frame('<div class="mid"><div class="end">'+
    '<div class="end-count">지금까지 '+done+'개를 분류했어요</div>'+
    (hard.length>0
      ? '<div class="end-sub">어려웠던 쓰레기</div><div class="hard">'+
        hard.map(x=>'<div class="hard-card">'+imgHTML(x.id,x.name)+
                    '<div class="hard-name">'+x.name+'</div></div>').join('')+'</div>'
      : '<div class="end-sub">아직 틀린 쓰레기가 없어요</div>')+
    '<div class="foot">'+
      '<button class="next" id="resumeBtn">계속하기</button>'+
      '<button class="btn-sub" id="restartBtn">처음으로</button>'+
    '</div></div></div>',{home:false});
  document.getElementById('resumeBtn').addEventListener('click',()=>{
    if(resumeFn) resumeFn(); else renderStart();
  });
  document.getElementById('restartBtn').addEventListener('click',()=>{
    hideBanner(); locked=false; selected=null; renderStart();
  });
}

/* ═══════════ 종료 ═══════════ */
function renderEnd(){
  const total=qList.length;
  const hard=ITEMS.filter(x=>wrongIds.has(x.id));
  frame('<div class="mid"><div class="end">'+
    '<div class="end-count">우리 팀은 '+total+'개를 분류했어요</div>'+
    (hard.length>0
      ? '<div class="end-sub">어려웠던 쓰레기</div><div class="hard">'+
        hard.map(x=>'<div class="hard-card">'+imgHTML(x.id,x.name)+
                    '<div class="hard-name">'+x.name+'</div></div>').join('')+'</div>'
      : '<div class="end-sub">한 번에 모두 맞혔어요</div>')+
    '<button class="next" id="againBtn">처음으로</button></div></div>',{home:false});
  document.getElementById('againBtn').addEventListener('click',renderStart);
}

renderStart();
</script>
</body>
</html>
